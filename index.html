<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content Creation 4 Beginners 🏳️‍🌈</title>
<style>
:root{--bg:#f6f5f2;--fg:#151515;--mute:#76736c;--line:#dcd9d1;--card:#fff;--acc:#d6381f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--fg:#ececec;--mute:#8a8a8a;--line:#262626;--card:#161616;--acc:#ff5a3c}}
:root[data-theme="dark"]{--bg:#0e0e0e;--fg:#ececec;--mute:#8a8a8a;--line:#262626;--card:#161616;--acc:#ff5a3c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,monospace;min-height:100vh}
#bar{position:fixed;top:0;left:0;height:6px;width:0;transition:width .25s;z-index:5;background:linear-gradient(90deg,#e40303,#ff8c00,#ffed00,#008026,#24408e,#732982)}
#bar::after{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;background:#fff;opacity:.6}
h1::after{content:"";display:block;height:4px;width:72px;margin-top:14px;border-radius:2px;background:var(--acc)}
nav{border-image:linear-gradient(90deg,#e40303,#ff8c00,#ffed00,#008026,#24408e,#732982) 1;border-top-width:3px}
main{max-width:640px;margin:0 auto;padding:12vh 22px 140px}
.n{color:var(--mute);font-size:13px;margin-bottom:10px}
h1{font-size:clamp(24px,6vw,34px);line-height:1.2;margin:0 0 22px;font-weight:700}
h1::before{content:". ";color:var(--acc)}
p{margin:0 0 16px}
ul{padding-left:20px;margin:0 0 16px}li{margin-bottom:6px}
code{background:var(--card);border:1px solid var(--line);padding:2px 6px;border-radius:4px;font-size:13px;word-break:break-all}
a.btn{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;margin:0 0 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--fg);text-decoration:none}
a.btn:hover{border-color:var(--acc)}a.btn span:last-child{color:var(--acc)}
.ex{border-left:2px solid var(--acc);padding:2px 0 2px 14px;margin:0 0 12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
nav>div{display:flex;gap:10px;width:100%;max-width:640px;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:11px 18px;border-radius:8px}
button#next{background:var(--acc);border-color:var(--acc);color:#fff;margin-left:auto}
button:disabled{opacity:.3;cursor:default}
#c{color:var(--mute);font-size:13px}
.wip{color:var(--mute)}
.v{position:relative;aspect-ratio:16/9;margin:0 0 12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000}
.v iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.d{margin:0 0 12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.d iframe{display:block;width:100%;height:380px;border:0}
a.s{display:block;color:var(--mute);font-size:13px;margin:0 0 16px;text-decoration:none}a.s:hover{color:var(--acc)}
</style>
</head>
<body>
<div id="bar"></div>
<main id="m"></main>
<nav><div><button id="prev">← back</button><span id="c"></span><button id="next">next →</button></div></nav>
<script>
var L=function(u,t){return '<a class="btn" href="'+u+'" target="_blank" rel="noopener"><span>'+t+'</span><span>↗</span></a>'};
var Y=function(id){return '<div class="v"><iframe src="https://www.youtube-nocookie.com/embed/'+id+'" title="video" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div><a class="s" href="https://youtu.be/'+id+'" target="_blank" rel="noopener">not loading? open on youtube ↗</a>'};
var D=function(id){return '<div class="d"><iframe src="https://drive.google.com/embeddedfolderview?id='+id+'#list" title="folder" loading="lazy"></iframe></div><a class="s" href="https://drive.google.com/drive/folders/'+id+'" target="_blank" rel="noopener">not loading? open in drive ↗</a>'};
var S=[
{id:"assets",t:"assets",b:D("1UWRIP1RsrQP1stHOqwUQhjOHAca4mvMN")},
{id:"voice",t:"the voice",b:"<p>The voice is incredibly important. A bad voice can kill a video, but a good voice can blow it up.</p>"+Y("n3S3GU6RsBw")},
{id:"aspect-ratio",t:"aspect ratio",b:"<p>If you’re posting short form vertical videos you need to change your aspect ratio.</p>"+Y("WCV3pzyYsjk")},
{id:"bypass-pro",t:"how to bypass pro (capcut pc)",b:"<p>Apply motion blur to a video. You can set the effect to 0.</p><p>The path is:</p><ul><li>Windows: <code>%userprofile%\\AppData\\Local\\CapCut\\User Data\\Cache\\MotionBlurCache</code></li><li>macOS: <code>~/Movies/CapCut/User Data/Cache/MotionBlurCache</code></li></ul>"+Y("CpEQpUztwvA")},
{id:"captions",t:"captions",b:"<p>The positioning of the captions depends on your video.</p>"+Y("GwnahpuELUU")},
{id:"music",t:"music choice",b:"<p>For the vast majority of videos, use an upbeat song, especially short form.</p><p>Nintendo songs, especially Mario games, have an amazing use case.</p>"+D("1SkH-LYUauIwtBaEUJFR8gFZXOYv4xGa8")},
{id:"sound-effects",t:"sound effect choice",b:D("1MUydGbaIVh78rbdX4pjXNhyzZQwRz1Ff")},
{id:"warm-up",t:"warming up your account",b:"<p>To warm up an account is to use it like anyone else would: watch videos, scroll, like, comment, subscribe, follow channels.</p><p>There’s no magic number and it differs per platform. Best advice: use old accounts, even with previous uploads. You can always private them.</p><ul><li>YouTube: 4 days</li><li>TikTok: 7 days</li><li>Instagram: several weeks. It’s incredibly strict.</li></ul>"},
{id:"titles",t:"what to title your videos",b:"<p>Keep it consistent with your other uploads. Titles like “I can’t believe this happened” or “This is crazy” look unprofessional and make your video harder to find in search.</p><p>Formula:</p><ul><li>what is happening in the video</li><li>what the viewer is supposed to feel</li><li>optional formatter</li></ul><div class=\"ex\">This Might Be The End Of Roblox Because Of (topic)😔… | September 7 2026</div><div class=\"ex\">Why Did (person) Do (action) To (other person)?😳… | Part 2</div>"},
{id:"view-jails",t:"how to escape view jails",b:"<p class=\"wip\">wip.</p>"},
{id:"end",t:"end.",b:""}
];
var i=0,m=document.getElementById("m"),pv=document.getElementById("prev"),nx=document.getElementById("next");
function go(n,push){
 i=Math.max(0,Math.min(S.length-1,n));var s=S[i];
 m.innerHTML='<div class="n">'+String(i+1).padStart(2,"0")+" / "+String(S.length).padStart(2,"0")+"</div><h1>"+s.t+"</h1>"+s.b;
 var P=["#e40303","#ff8c00","#c9a800","#008026","#24408e","#732982"];document.documentElement.style.setProperty("--acc",P[i%P.length]);
 document.getElementById("bar").style.width=((i+1)/S.length*100)+"%";
 document.getElementById("c").textContent=(i+1)+"/"+S.length;
 pv.disabled=i===0;nx.disabled=i===S.length-1;
 if(push!==false){try{history.replaceState(null,"","#"+s.id)}catch(e){location.hash=s.id}}
 window.scrollTo(0,0);
}
function fromHash(){var h=location.hash.slice(1),k=S.findIndex(function(s){return s.id===h});go(k<0?0:k,false)}
pv.onclick=function(){go(i-1)};nx.onclick=function(){go(i+1)};
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")go(i+1);if(e.key==="ArrowLeft")go(i-1)});
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
</body>
</html>
